spring.application.name=game-leaderboard-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leaderboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leaderboard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leaderboard}
spring.jpa.hibernate.ddl-auto=update
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
